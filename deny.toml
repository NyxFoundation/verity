# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# RustSec advisories: vulnerabilities and unmaintained crates fail by default in version 2.
yanked = "deny"
ignore = [
    # `paste` is archived and unmaintained. It is a proc macro with no runtime surface, reached
    # only transitively by two independent paths we do not control: alloy-primitives (via
    # ethereum_ssz, pulled in by leanSig) and netlink-packet-core (via libp2p-quic). There is no
    # vulnerability, only the unmaintained status. Revisit when either path drops it.
    "RUSTSEC-2024-0436",
    # `ansi_term` is deprecated and unmaintained. It arrives through leanVM's tracing setup
    # (`utils` -> `tracing-forest` -> `ansi_term`) and only colours log output. There is no
    # vulnerability and no safe upgrade; the fix has to happen in `tracing-forest`. Revisit
    # when leanVM's tracing dependency moves.
    "RUSTSEC-2021-0139",
    # `atomic-polyfill` is archived and unmaintained. It arrives through leanVM's proof
    # serialization (`rec_aggregation` -> `postcard` -> `heapless` -> `atomic-polyfill`) and
    # exists to emulate atomics on targets that lack them, which Verity's do not. There is no
    # vulnerability and no safe upgrade. Revisit when `heapless` drops it.
    "RUSTSEC-2023-0089",
]

[licenses]
version = 2
# SPDX identifiers permitted for dependencies. Extend deliberately as the tree grows.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # foldhash, reached through hashbrown and alloy-primitives.
    "Zlib",
]
confidence-threshold = 0.9
# leanSig declares no `license` field in its manifest, so cargo-deny emits a standing
# `no-license-field` warning for it. The check still passes on the strength of the file scan, which
# resolves its Apache-2.0 LICENSE above this threshold. That scan is what satisfies the check, so a
# `[[licenses.clarify]]` entry for leanSig changes nothing — do not add one.

# leanVM is Apache-2.0, stated in a LICENSE file at its repository root. Its crates are
# workspace members in subdirectories, none of which declares a `license` field or carries a
# copy of that file, so neither the manifest scan nor the file scan finds anything and every
# one of them reads as unlicensed. The clarifications below say what the repository says.
#
# This is the case the note above leanSig distinguishes: leanSig's package root *is* its
# repository root, so its LICENSE is found and a clarification would be redundant. These have
# no such file to find.
#
# `license-files` is empty on purpose. A hash entry would pin a file that does not exist in
# these packages; the claim rests on the repository's LICENSE, not on a per-crate copy.

[[licenses.clarify]]
crate = "backend"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "lean_compiler"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "lean_prover"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "lean_vm"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "leansig_wrapper"
expression = "Apache-2.0"
license-files = []

