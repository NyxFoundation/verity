[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# leanSig is not published to crates.io, so it is consumed as a rev-pinned git dependency.
# Plonky3 arrives transitively through leanSig and is likewise unpublished. These entries only say
# the hosts are sources we accept; the revisions are pinned elsewhere — leanSig's in Cargo.toml,
# Plonky3's in Cargo.lock (see the leanSig comment in Cargo.toml for why it cannot live in either
# manifest).
allow-git = [
    "https://github.com/leanEthereum/leanSig",
    "https://github.com/leanEthereum/leanVM",
    "https://github.com/Plonky3/Plonky3.git",
    # leanVM's `leansig_wrapper` depends on a fast-keygen fork of leanSig that upstream has not
    # merged. It arrives transitively and is branch-tracked at its source, so its revision is
    # pinned in Cargo.lock like Plonky3's, not in any manifest we control.
    "https://github.com/TomWambsgans/leanSig",
]
