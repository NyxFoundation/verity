# typos spell-check configuration. https://github.com/crate-ci/typos
# Add intentional terms that look like typos to [default.extend-words] as they surface.

[files]
extend-exclude = [
    "docs/book/",
    "Cargo.lock",
    # Vendored mdbook-mermaid assets (minified; regenerated on mdbook-mermaid bumps).
    "docs/mermaid.min.js",
    "docs/mermaid-init.js",
]

[default.extend-words]
# "ser" — serialization abbreviation (mermaid node IDs, serde ser/de), not a typo of "set".
ser = "ser"
# "symetric" — the real directory name in leanMultisig (`crates/backend/symetric`), misspelled
# upstream. Correcting it in our docs would point readers at a path that does not exist.
symetric = "symetric"

[default.extend-identifiers]
# Abbreviated git commit SHA of leanEthereum/leanSig cited in KEY_MANAGEMENT.md; the
# trailing "ba" is not a typo of "by"/"be".
c08a3ba = "c08a3ba"
