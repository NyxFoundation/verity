# typos spell-check configuration. https://github.com/crate-ci/typos
# Add intentional terms that look like typos to [default.extend-words] as they surface.

[files]
extend-exclude = [
    "docs/book/",
    "Cargo.lock",
]

[default.extend-words]
# "ser" — serialization abbreviation (mermaid node IDs, serde ser/de), not a typo of "set".
ser = "ser"
