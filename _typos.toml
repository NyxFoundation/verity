# typos spell-check configuration. https://github.com/crate-ci/typos
# Add intentional terms that look like typos to [default.extend-words] as they surface.

[files]
extend-exclude = [
    "docs/book/",
    "Cargo.lock",
    # Vendored mdbook-mermaid assets (minified; regenerated on mdbook-mermaid bumps).
    "docs/mermaid.min.js",
    "docs/mermaid-init.js",
    # Generated Lean / LLBC on the hax verification branch.
    "crates/verity-justifiability/proofs/",
]

[default]
# ENR records are base64url and land in tests as real-world samples; any 2-4 letter run inside
# one is noise to a spell-checker, not a word.
extend-ignore-re = ["enr:-[A-Za-z0-9_-]+"]

[default.extend-words]
# "ser" — serialization abbreviation (mermaid node IDs, serde ser/de), not a typo of "set".
ser = "ser"
# "symetric" — the real directory name in leanVM (`crates/backend/symetric`), misspelled
# upstream. Correcting it in our docs would point readers at a path that does not exist.
symetric = "symetric"
# The Cryspen extraction toolchain, not a misspelling of "hex".
hax = "hax"

[default.extend-identifiers]
# Abbreviated git commit SHA of leanEthereum/leanSig cited in docs/design/key-management.md; the
# trailing "ba" is not a typo of "by"/"be".
c08a3ba = "c08a3ba"
