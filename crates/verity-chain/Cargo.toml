[package]
name = "verity-chain"
description = "Consensus decisions over the container types: the state transition, fork choice, justification candidacy, and the slot clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Pure decisions over `verity-types` shapes. No storage, no networking, no cryptography, and
# no wall clock: every function here takes the time it should reason about as an argument.
#
# `libssz-merkle` is here for one reason: the state transition commits to `hash_tree_root` of
# the state, the parent header, and the block body, so the decision cannot be expressed
# without it. `libssz` is here for a second: leanSpec breaks a proof-selection tie on the
# candidates' canonical encodings, so block building cannot be expressed without one either.
# Both are the same Serialization capability `verity-types` already depends on, not a new
# supplier.
[dependencies]
libssz.workspace = true
libssz-merkle.workspace = true
libssz-types.workspace = true
verity-types.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
