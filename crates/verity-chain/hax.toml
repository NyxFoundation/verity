# Extraction of the pure functions in this crate.
# Lives on the hax verification branch only; not merged to develop.
#
# STF, fork choice, and block production were attempted and classified
# as extractor limits (closures / HashMap iterators / nested-loop return).
# They stay out. Do not rewrite production code to make them extract.

[scenario.pure]
backend = "lean"
include = [
    "verity_chain::justification",
    "verity_chain::proposer",
    "verity_chain::slot_clock",
]

[scenario.merkle]
backend = "lean"
include = ["verity_chain::merkle"]
