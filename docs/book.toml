[book]
title = "Verity Documentation"
description = "Documentation for Verity — the Provable Consensus Client."
authors = ["Nyx Foundation"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/NyxFoundation/verity"
edit-url-template = "https://github.com/NyxFoundation/verity/edit/develop/docs/{path}"
site-url = "/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor.strip-frontmatter]
# Strips the YAML frontmatter (title / last_updated / tags) that repo
# convention requires in every docs/ Markdown file; mdBook would otherwise
# render it as visible text. Requires python3; run mdbook from docs/.
command = "python3 preprocessors/strip-frontmatter.py"

[preprocessor.mermaid]
command = "mdbook-mermaid"
