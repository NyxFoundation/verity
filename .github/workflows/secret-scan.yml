name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the `git` scan inspects every commit, not just the tip.
          fetch-depth: 0

      # betterleaks (Gitleaks successor) has no official Action yet; run the pinned image.
      # Subcommands are git/dir/github/s3/stdin (no `detect`); --exit-code 1 fails CI on findings.
      - name: Run betterleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/betterleaks/betterleaks:v1.3.1 \
            git /repo -v --exit-code 1
