name: Quality

on:
  push:
    # develop = DEV; main = PRD. Lint runs on both.
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full (online) link check — Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # Enforcement gate for the local pre-commit hooks: runs the same .pre-commit-config.yaml
    # so PRs from contributors who skip the hooks (--no-verify, or never ran `pre-commit
    # install`) are still linted. Skip the scheduled run (that one is for link checking).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # SKIP=fmt,clippy: this lightweight job has no Rust toolchain — rust.yml runs those
      # where the cache lives. pre-commit/action caches the hook environments.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: fmt,clippy

  internal-links:
    # Offline link check on every PR: relative and anchor targets only, so it is
    # deterministic and cannot be blocked by an external host. Lives here rather than
    # in docs.yml because that workflow is path-filtered to the book's own inputs,
    # and docs/design/ is outside them. Skip the scheduled run — that one is online.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress docs/src docs/design"
          fail: true

  link-check:
    # Full external link check on a schedule (and on demand) — kept off PRs to avoid
    # flaky external rate-limits blocking merges. PR-time link checking is the
    # `internal-links` job above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress docs/src docs/design README.md CONTRIBUTING.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
