name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          # SUMMARY.md is mdBook's TOC — multiple H1 part-titles are by design.
          globs: |
            docs/src/**/*.md
            !docs/src/SUMMARY.md

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: verify relative/anchor links only — deterministic on PRs.
          # External links are checked on a schedule by the Quality workflow.
          args: "--offline --no-progress docs/src"
          fail: true

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Setup mdbook-mermaid
        # 0.16.2 is the newest release compatible with mdBook 0.4.40
        # (0.17.0 targets the mdBook 0.5 JSON protocol and fails to parse).
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/badboy/mdbook-mermaid/releases/download/v0.16.2/mdbook-mermaid-v0.16.2-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: mdbook-site
          path: docs/book

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: https://docs.verityclient.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mdbook-site
          path: docs/book

      - name: Deploy to Cloudflare Workers (Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
